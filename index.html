<body>
    <header>
        <h1>Manejo e Alimentação Animal 🐄🐏</h1>
        <p>Como fazer o Manejo e a Alimentação correta para o animal</p>

    <main>
        <img src="manejo animal.png" alt="Uma fotografia panorâmica de ângulo médio mostra uma fazenda integrada e organizada durante o pôr do sol.
    O cenário é composto por pastagens verdejantes e colinas onduladas ao fundo sob um céu dourado. Não há pessoas na cena.
    No topo da imagem, está centralizado o texto em letras maiúsculas: MANEJO E ALIMENTAÇÃO ANIMAL INTEGRADA.">
    
    <div>
        <h2> Meu Primeiro Post</h2>  
        <p class="autor"> Por: Gabriela Lenartovicz</p>
        <p>Meu Primeiro Post sobre Manejo e Alimentação Animal</p>
        <button>❤️<span>0</span></button>
        <button>👎<span>0</span></button>
    </div>

    </main>
<footer>
    <p>Por: Gabriela Lenartovicz</p>
</footer>

</body>
<script>
    const botoes = document.querySelectorAll("button");

    botoes.forEach(function(botao) {
        let curtiu = false;
        botao.addEventListener("click", botaoClicado);
        function botaoClicado(){
            let texto = botao.querySelector("span");
            if(curtiu === false;)
            texto.textContent++;
            curtiu = true;
        }
        else{
            texto.textContent--;
            curtiu = false;
        }
    }
    )

</script>
